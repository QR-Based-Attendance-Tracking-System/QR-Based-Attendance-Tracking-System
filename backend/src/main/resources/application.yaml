server:
  port: ${PORT:8080}

spring:
  application:
    name: qr-attendance-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/qr_attendance_db}
    username: ${DATABASE_USERNAME:qr_attendance_app}
    password: ${DATABASE_PASSWORD:}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

app:
  security:
    cookie-secure: ${APP_SECURITY_COOKIE_SECURE:true}
    allowed-origins: ${APP_SECURITY_ALLOWED_ORIGINS:http://localhost:3000}
    student-registration-code: ${APP_STUDENT_REGISTRATION_CODE:}
    lecturer-registration-code: ${APP_LECTURER_REGISTRATION_CODE:}

attendance:
  # Required. A missing signing key prevents startup instead of using a predictable default.
  qr-token-secret: ${ATTENDANCE_QR_TOKEN_SECRET}
  qr-token-validity-seconds: ${ATTENDANCE_QR_TOKEN_VALIDITY_SECONDS:30}